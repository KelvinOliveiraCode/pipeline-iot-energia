[project]
name = "pipeline-iot-energia"
version = "0.1.0"
description = "Agregação horária de consumo de energia IoT com dashboard (Python + SQLite)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
pipeline-iot-energia = "pipeline_iot_energia.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_iot_energia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
